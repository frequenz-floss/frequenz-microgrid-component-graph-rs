name: Component Graph CI

on:
  merge_group:
  push:
    branches-ignore:
      # Ignore pushes to merge queues.
      # We only want to test the merge commit (`merge_group` event), the hashes
      # in the push were already tested by the PR checks
      - 'gh-readonly-queue/**'
      - 'dependabot/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Print environment (debug)
        run: env

      - name: Fetch sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Two runs: the default (no-feature) configuration is what dependents
      # get and has its own `#[cfg(not(feature = "explain"))]` code, while
      # `--all-features` is the only run that compiles the feature-gated
      # tests in. Neither run covers the other.
      - name: Run tests (default features)
        uses: frequenz-floss/gh-action-cargo-test@v1.0.0

      - name: Run tests (all features)
        uses: frequenz-floss/gh-action-cargo-test@v1.0.0
        with:
          cargo-test-parameters: --all-features
